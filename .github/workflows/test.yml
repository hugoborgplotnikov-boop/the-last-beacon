name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 (headless)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1-stable
          use-dotnet: false

      - name: Run the headless test suite
        run: |
          cd dev/TheLastBeacon
          GODOT_BIN=godot bash tests/run_tests.sh
